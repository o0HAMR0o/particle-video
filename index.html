<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEO PARTICLES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Courier New',monospace; color:#fff; }

  #upload-screen {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#000; z-index:100; cursor:pointer; transition:opacity 0.6s;
  }
  #upload-screen.hidden { opacity:0; pointer-events:none; }
  .box { border:1px solid rgba(255,255,255,0.2); padding:60px 80px; text-align:center; transition:border-color 0.3s; }
  #upload-screen:hover .box { border-color:rgba(255,255,255,0.5); }
  .t1 { font-size:11px; letter-spacing:0.4em; color:rgba(255,255,255,0.3); margin-bottom:28px; text-transform:uppercase; }
  .ic { font-size:44px; margin-bottom:20px; opacity:0.5; }
  .t2 { font-size:20px; font-weight:300; letter-spacing:0.1em; margin-bottom:10px; }
  .t3 { font-size:11px; letter-spacing:0.2em; color:rgba(255,255,255,0.25); }
  #file-input { display:none; }

  #app { position:fixed; inset:0; display:none; }
  #app.visible { display:block; }
  #threeCanvas { width:100%; height:100%; }

  #controls {
    position:fixed; bottom:0; left:0; right:0;
    padding:18px 28px; display:flex; align-items:center; gap:20px;
    background:linear-gradient(transparent,rgba(0,0,0,0.85)); z-index:10;
  }
  .btn { background:none; border:1px solid rgba(255,255,255,0.25); color:#fff; width:34px; height:34px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color 0.2s; }
  .btn:hover { border-color:rgba(255,255,255,0.6); }
  .lbl { font-size:10px; letter-spacing:0.3em; color:rgba(255,255,255,0.3); text-transform:uppercase; white-space:nowrap; }
  .sg { display:flex; align-items:center; gap:8px; flex:1; }
  input[type=range] { -webkit-appearance:none; height:1px; background:rgba(255,255,255,0.25); outline:none; flex:1; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:9px; height:9px; background:#fff; border-radius:50%; }

  #info { position:fixed; top:22px; left:28px; pointer-events:none; z-index:10; }
  .i1 { font-size:10px; letter-spacing:0.4em; color:rgba(255,255,255,0.2); text-transform:uppercase; margin-bottom:4px; }
  .i2 { font-size:11px; letter-spacing:0.15em; color:rgba(255,255,255,0.35); }
  #hint { position:fixed; top:22px; right:28px; font-size:10px; letter-spacing:0.2em; color:rgba(255,255,255,0.15); pointer-events:none; z-index:10; text-align:right; line-height:2.2; }
</style>
</head>
<body>

<div id="upload-screen">
  <div class="box">
    <div class="t1">Video Particle System</div>
    <div class="ic">⬡</div>
    <div class="t2">動画をドロップ / クリックして選択</div>
    <div class="t3">MP4 · MOV · WEBM</div>
  </div>
  <input type="file" id="file-input" accept="video/*">
</div>

<div id="app">
  <canvas id="threeCanvas"></canvas>
  <div id="info">
    <div class="i1">Particle Field</div>
    <div class="i2" id="pcount">— particles</div>
  </div>
  <div id="hint">drag · rotate<br>scroll · zoom</div>
  <div id="controls">
    <button class="btn" id="btnPlay">▶</button>
    <span class="lbl">density</span>
    <div class="sg"><input type="range" id="sDensity" min="2" max="10" value="4" step="1"></div>
    <span class="lbl">depth</span>
    <div class="sg"><input type="range" id="sDepth" min="10" max="250" value="80" step="5"></div>
    <span class="lbl">size</span>
    <div class="sg"><input type="range" id="sSize" min="0.5" max="5" value="2" step="0.1"></div>
    <button class="btn" id="btnReset">⟳</button>
  </div>
</div>

<video id="vid" loop playsinline muted style="display:none"></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── renderer ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 3000);
camera.position.z = 600;

// ── orbit controls ────────────────────────────────────────────────────────────
{
  const s=new THREE.Spherical(), sd=new THREE.Spherical();
  const tgt=new THREE.Vector3(), pan=new THREE.Vector3();
  let sc=1, down=false, btn=-1;
  const rs=new THREE.Vector2(), re=new THREE.Vector2(), rd=new THREE.Vector2();
  const ps=new THREE.Vector2(), pe=new THREE.Vector2(), pd=new THREE.Vector2();
  const EPS=1e-6;
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('mousedown',e=>{
    down=true; btn=e.button;
    if(btn===0) rs.set(e.clientX,e.clientY);
    if(btn===2) ps.set(e.clientX,e.clientY);
  });
  window.addEventListener('mousemove',e=>{
    if(!down) return;
    if(btn===0){
      re.set(e.clientX,e.clientY);
      rd.subVectors(re,rs).multiplyScalar(0.005);
      sd.theta-=rd.x; sd.phi-=rd.y;
      rs.copy(re);
    }
    if(btn===2){
      pe.set(e.clientX,e.clientY);
      pd.subVectors(pe,ps).multiplyScalar(0.6);
      pan.add(new THREE.Vector3(-pd.x,pd.y,0).applyQuaternion(camera.quaternion));
      ps.copy(pe);
    }
  });
  window.addEventListener('mouseup',()=>down=false);
  canvas.addEventListener('wheel',e=>{
    sc*=e.deltaY<0?1/1.1:1.1;
    sc=Math.max(0.05,Math.min(20,sc));
  });
  window._orbit=()=>{
    const o=new THREE.Vector3().copy(camera.position).sub(tgt);
    s.setFromVector3(o);
    s.theta+=sd.theta; s.phi+=sd.phi;
    s.phi=Math.max(EPS,Math.min(Math.PI-EPS,s.phi));
    s.radius=Math.max(50,Math.min(2000,s.radius*sc));
    tgt.add(pan);
    camera.position.copy(tgt).add(new THREE.Vector3().setFromSpherical(s));
    camera.lookAt(tgt);
    sd.set(0,0,0); sc=1; pan.set(0,0,0);
  };
  window._resetOrbit=()=>{
    camera.position.set(0,0,600);
    tgt.set(0,0,0); sd.set(0,0,0); sc=1; pan.set(0,0,0);
  };
}

// ── GPU video sampling ────────────────────────────────────────────────────────
const vid = document.getElementById('vid');
let vidTex = null;

const RT_W=320, RT_H=180;
const rt = new THREE.WebGLRenderTarget(RT_W, RT_H, {
  minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
  format:THREE.RGBAFormat, type:THREE.UnsignedByteType,
});
const rtScene  = new THREE.Scene();
const rtCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadMat  = new THREE.MeshBasicMaterial({ side:THREE.DoubleSide });
const quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), quadMat);
rtScene.add(quadMesh);
const pixelBuf = new Uint8Array(RT_W * RT_H * 4);

// ── particles ─────────────────────────────────────────────────────────────────
let geo, pts, pos, aCol, sz;
let STEP=4, DEPTH=80, PSIZE=2;

// KEY FIX: attribute named 'aColor' instead of 'color' to avoid Three.js conflict
const vertexShader = `
  attribute float size;
  attribute vec3 aColor;
  varying vec3 vCol;
  varying float vBright;
  void main(){
    vCol    = aColor;
    vBright = dot(aColor, vec3(0.299, 0.587, 0.114));
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (350.0 / -mv.z);
    gl_Position  = projectionMatrix * mv;
  }
`;
const fragmentShader = `
  varying vec3 vCol;
  varying float vBright;
  void main(){
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if(d > 0.5) discard;
    float core = 1.0 - smoothstep(0.0,  0.22, d);
    float halo = 1.0 - smoothstep(0.1,  0.5,  d);
    float a    = (core * 0.95 + halo * 0.35) * min(vBright * 2.2, 1.0);
    gl_FragColor = vec4(vCol * (core * 0.6 + 0.4), a);
  }
`;

function buildParticles(){
  const cols=Math.floor(RT_W/STEP);
  const rows=Math.floor(RT_H/STEP);
  const n=cols*rows;
  document.getElementById('pcount').textContent=n.toLocaleString()+' particles';

  if(geo){ geo.dispose(); }
  if(pts){ scene.remove(pts); }

  geo  = new THREE.BufferGeometry();
  pos  = new Float32Array(n*3);
  aCol = new Float32Array(n*3);
  sz   = new Float32Array(n);

  geo.setAttribute('position', new THREE.BufferAttribute(pos,  3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(aCol, 3)); // 'aColor' not 'color'
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,   1));

  const mat = new THREE.ShaderMaterial({
    vertexShader, fragmentShader,
    transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending,
  });

  pts = new THREE.Points(geo, mat);
  scene.add(pts);
}

function sample(){
  if(!vidTex || vid.readyState < 2) return;

  vidTex.needsUpdate = true;
  quadMat.map = vidTex;

  renderer.setRenderTarget(rt);
  renderer.render(rtScene, rtCamera);
  renderer.setRenderTarget(null);

  renderer.readRenderTargetPixels(rt, 0, 0, RT_W, RT_H, pixelBuf);

  const cols=Math.floor(RT_W/STEP);
  const rows=Math.floor(RT_H/STEP);
  const ox=-cols*0.5, oy=-rows*0.5;

  let idx=0;
  for(let row=0; row<rows; row++){
    for(let c=0; c<cols; c++){
      const px = c * STEP;
      const py = RT_H - 1 - row * STEP; // WebGL is bottom-up
      const pi = (py * RT_W + px) * 4;

      const r  = pixelBuf[pi]   / 255;
      const g  = pixelBuf[pi+1] / 255;
      const b  = pixelBuf[pi+2] / 255;
      const br = 0.299*r + 0.587*g + 0.114*b;
      const on = br > 0.015 ? 1 : 0;

      pos[idx*3]   = (c+ox) * 2.3;
      pos[idx*3+1] = -(row+oy) * 2.3;
      pos[idx*3+2] = br * DEPTH * on;

      aCol[idx*3]   = r * on;
      aCol[idx*3+1] = g * on;
      aCol[idx*3+2] = b * on;

      sz[idx] = PSIZE * (0.3 + br * 1.7) * on;
      idx++;
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.aColor.needsUpdate   = true;
  geo.attributes.size.needsUpdate     = true;
}

// ── animate ───────────────────────────────────────────────────────────────────
(function animate(){
  requestAnimationFrame(animate);
  window._orbit();
  sample();
  renderer.render(scene, camera);
})();

// ── file load ─────────────────────────────────────────────────────────────────
const up   = document.getElementById('upload-screen');
const fi   = document.getElementById('file-input');
const app  = document.getElementById('app');
const btnP = document.getElementById('btnPlay');

up.addEventListener('click', ()=>fi.click());
up.addEventListener('dragover', e=>{ e.preventDefault(); up.style.background='rgba(255,255,255,0.02)'; });
up.addEventListener('dragleave', ()=>up.style.background='#000');
up.addEventListener('drop', e=>{
  e.preventDefault();
  const f=e.dataTransfer.files[0];
  if(f && f.type.startsWith('video/')) load(f);
});
fi.addEventListener('change', e=>{ if(e.target.files[0]) load(e.target.files[0]); });

function load(file){
  if(vid.src) URL.revokeObjectURL(vid.src);
  vid.removeAttribute('crossorigin');
  vid.src = URL.createObjectURL(file);

  vid.addEventListener('canplay', ()=>{
    vid.play().catch(()=>{});

    if(vidTex) vidTex.dispose();
    vidTex = new THREE.VideoTexture(vid);
    vidTex.minFilter = THREE.LinearFilter;
    vidTex.magFilter = THREE.LinearFilter;
    vidTex.format    = THREE.RGBFormat;

    buildParticles();
    up.classList.add('hidden');
    app.classList.add('visible');
  }, { once:true });

  vid.load();
}

// ── controls ──────────────────────────────────────────────────────────────────
btnP.addEventListener('click', ()=>{ if(vid.paused) vid.play(); else vid.pause(); });
vid.addEventListener('play',  ()=>btnP.textContent='⏸');
vid.addEventListener('pause', ()=>btnP.textContent='▶');

document.getElementById('sDensity').addEventListener('input', e=>{
  STEP=parseInt(e.target.value); if(vid.videoWidth) buildParticles();
});
document.getElementById('sDepth').addEventListener('input', e=>DEPTH=parseInt(e.target.value));
document.getElementById('sSize').addEventListener('input',  e=>PSIZE=parseFloat(e.target.value));
document.getElementById('btnReset').addEventListener('click', window._resetOrbit);

window.addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
