<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEO PARTICLES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Courier New',monospace; color:#fff; }

  #upload-screen {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#000; z-index:100; cursor:pointer; transition:opacity 0.6s;
  }
  #upload-screen.hidden { opacity:0; pointer-events:none; }
  .box { border:1px solid rgba(255,255,255,0.2); padding:60px 80px; text-align:center; transition:border-color 0.3s; }
  #upload-screen:hover .box { border-color:rgba(255,255,255,0.5); }
  .t1 { font-size:11px; letter-spacing:0.4em; color:rgba(255,255,255,0.3); margin-bottom:28px; text-transform:uppercase; }
  .ic { font-size:44px; margin-bottom:20px; opacity:0.5; }
  .t2 { font-size:20px; font-weight:300; letter-spacing:0.1em; margin-bottom:10px; }
  .t3 { font-size:11px; letter-spacing:0.2em; color:rgba(255,255,255,0.25); }
  #file-input { display:none; }

  #app { position:fixed; inset:0; display:none; }
  #app.visible { display:block; }
  #threeCanvas { width:100%; height:100%; display:block; }

  #controls {
    position:fixed; bottom:0; left:0; right:0;
    padding:18px 28px; display:flex; align-items:center; gap:20px;
    background:linear-gradient(transparent,rgba(0,0,0,0.85)); z-index:10;
  }
  .btn { background:none; border:1px solid rgba(255,255,255,0.25); color:#fff; width:34px; height:34px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color 0.2s; }
  .btn:hover { border-color:rgba(255,255,255,0.6); }
  .lbl { font-size:10px; letter-spacing:0.3em; color:rgba(255,255,255,0.3); text-transform:uppercase; white-space:nowrap; }
  .sg { display:flex; align-items:center; gap:8px; flex:1; }
  input[type=range] { -webkit-appearance:none; height:1px; background:rgba(255,255,255,0.25); outline:none; flex:1; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:9px; height:9px; background:#fff; border-radius:50%; }

  #info { position:fixed; top:22px; left:28px; pointer-events:none; z-index:10; }
  .i1 { font-size:10px; letter-spacing:0.4em; color:rgba(255,255,255,0.2); text-transform:uppercase; margin-bottom:4px; }
  .i2 { font-size:11px; letter-spacing:0.15em; color:rgba(255,255,255,0.35); }
  #hint { position:fixed; top:22px; right:28px; font-size:10px; letter-spacing:0.2em; color:rgba(255,255,255,0.15); pointer-events:none; z-index:10; text-align:right; line-height:2.2; }
</style>
</head>
<body>

<div id="upload-screen">
  <div class="box">
    <div class="t1">Video Particle System</div>
    <div class="ic">⬡</div>
    <div class="t2">動画をドロップ / クリックして選択</div>
    <div class="t3">MP4 · MOV · WEBM</div>
  </div>
  <input type="file" id="file-input" accept="video/*">
</div>

<div id="app">
  <canvas id="threeCanvas"></canvas>
  <div id="info">
    <div class="i1">Particle Field</div>
    <div class="i2" id="pcount">— particles</div>
  </div>
  <div id="hint">drag · rotate<br>scroll · zoom<br>right drag · pan</div>
  <div id="controls">
    <button class="btn" id="btnPlay">▶</button>
    <span class="lbl">density</span>
    <div class="sg"><input type="range" id="sDensity" min="1" max="6" value="2" step="1"></div>
    <span class="lbl">depth</span>
    <div class="sg"><input type="range" id="sDepth" min="50" max="600" value="300" step="10"></div>
    <span class="lbl">size</span>
    <div class="sg"><input type="range" id="sSize" min="0.3" max="4" value="1.2" step="0.1"></div>
    <button class="btn" id="btnReset">⟳</button>
  </div>
</div>

<video id="vid" loop playsinline muted style="display:none"></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── renderer ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 5000);
camera.position.z = 700;

// ── orbit controls ────────────────────────────────────────────────────────────
{
  const sph = new THREE.Spherical();
  const sphD = new THREE.Spherical();
  const tgt = new THREE.Vector3();
  const panV = new THREE.Vector3();
  let scale = 1, isDown = false, mouseBtn = -1;
  const rS = new THREE.Vector2(), rE = new THREE.Vector2(), rD = new THREE.Vector2();
  const pS = new THREE.Vector2(), pE = new THREE.Vector2(), pD = new THREE.Vector2();
  const EPS = 1e-6;

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    isDown = true; mouseBtn = e.button;
    if (mouseBtn === 0) rS.set(e.clientX, e.clientY);
    if (mouseBtn === 2) pS.set(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', e => {
    if (!isDown) return;
    if (mouseBtn === 0) {
      rE.set(e.clientX, e.clientY);
      rD.subVectors(rE, rS).multiplyScalar(0.005);
      sphD.theta -= rD.x; sphD.phi -= rD.y;
      rS.copy(rE);
    }
    if (mouseBtn === 2) {
      pE.set(e.clientX, e.clientY);
      pD.subVectors(pE, pS).multiplyScalar(0.7);
      panV.add(new THREE.Vector3(-pD.x, pD.y, 0).applyQuaternion(camera.quaternion));
      pS.copy(pE);
    }
  });
  window.addEventListener('mouseup', () => isDown = false);
  canvas.addEventListener('wheel', e => {
    scale *= e.deltaY < 0 ? 1 / 1.1 : 1.1;
    scale = Math.max(0.05, Math.min(20, scale));
  });

  // Touch support
  let lastTouchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { isDown = true; mouseBtn = 0; rS.set(e.touches[0].clientX, e.touches[0].clientY); }
    if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && isDown) {
      rE.set(e.touches[0].clientX, e.touches[0].clientY);
      rD.subVectors(rE, rS).multiplyScalar(0.005);
      sphD.theta -= rD.x; sphD.phi -= rD.y;
      rS.copy(rE);
    }
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      scale *= lastTouchDist / d;
      scale = Math.max(0.05, Math.min(20, scale));
      lastTouchDist = d;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => isDown = false, { passive: true });

  window._orbit = () => {
    const offset = new THREE.Vector3().copy(camera.position).sub(tgt);
    sph.setFromVector3(offset);
    sph.theta += sphD.theta; sph.phi += sphD.phi;
    sph.phi = Math.max(EPS, Math.min(Math.PI - EPS, sph.phi));
    sph.radius = Math.max(80, Math.min(3000, sph.radius * scale));
    tgt.add(panV);
    camera.position.copy(tgt).add(new THREE.Vector3().setFromSpherical(sph));
    camera.lookAt(tgt);
    sphD.set(0, 0, 0); scale = 1; panV.set(0, 0, 0);
  };
  window._resetOrbit = () => {
    camera.position.set(0, 0, 700);
    tgt.set(0, 0, 0); sphD.set(0, 0, 0); scale = 1; panV.set(0, 0, 0);
  };
}

// ── GPU video sampling ────────────────────────────────────────────────────────
const vid = document.getElementById('vid');
let vidTex = null;

// Higher resolution sample for more particles
const RT_W = 480, RT_H = 270;
const rt = new THREE.WebGLRenderTarget(RT_W, RT_H, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType,
});
const rtScene  = new THREE.Scene();
const rtCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat  = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
rtScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat));
const pixelBuf = new Uint8Array(RT_W * RT_H * 4);

// ── shaders — uses 'aColor' NOT 'color' to avoid Three.js attribute conflict ──
const vertexShader = `
  attribute float aSize;
  attribute vec3 aColor;
  attribute float aDepthJitter;
  varying vec3 vCol;
  varying float vBright;
  void main() {
    vCol    = aColor;
    vBright = dot(aColor, vec3(0.299, 0.587, 0.114));

    // Add slight jitter on Z for sub-pixel depth variation
    vec3 p = position;
    p.z += aDepthJitter * vBright * 20.0;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_PointSize = aSize * (400.0 / -mv.z);
    gl_Position  = projectionMatrix * mv;
  }
`;
const fragmentShader = `
  varying vec3 vCol;
  varying float vBright;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    float core = 1.0 - smoothstep(0.0, 0.20, d);
    float mid  = 1.0 - smoothstep(0.1, 0.38, d);
    float halo = 1.0 - smoothstep(0.2, 0.50, d);
    float a = (core * 1.0 + mid * 0.5 + halo * 0.2) * min(vBright * 2.5, 1.0);
    vec3  c = vCol * (core * 0.7 + 0.3) + vec3(core * 0.15); // slight white core
    gl_FragColor = vec4(c, a);
  }
`;

// ── particles ─────────────────────────────────────────────────────────────────
let geo, pts, bufPos, bufCol, bufSize, bufJitter;
let STEP = 2, DEPTH = 300, PSIZE = 1.2;

function buildParticles() {
  const cols = Math.floor(RT_W / STEP);
  const rows = Math.floor(RT_H / STEP);
  const n    = cols * rows;
  document.getElementById('pcount').textContent = n.toLocaleString() + ' particles';

  if (geo) geo.dispose();
  if (pts) scene.remove(pts);

  geo      = new THREE.BufferGeometry();
  bufPos   = new Float32Array(n * 3);
  bufCol   = new Float32Array(n * 3);
  bufSize  = new Float32Array(n);
  bufJitter = new Float32Array(n);

  // Pre-fill depth jitter (random per particle, static)
  for (let i = 0; i < n; i++) bufJitter[i] = (Math.random() - 0.5) * 2.0;

  geo.setAttribute('position',    new THREE.BufferAttribute(bufPos,    3));
  geo.setAttribute('aColor',      new THREE.BufferAttribute(bufCol,    3));
  geo.setAttribute('aSize',       new THREE.BufferAttribute(bufSize,   1));
  geo.setAttribute('aDepthJitter',new THREE.BufferAttribute(bufJitter, 1));

  const mat = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    transparent: true,
    depthWrite:  false,
    blending:    THREE.AdditiveBlending,
  });

  pts = new THREE.Points(geo, mat);
  scene.add(pts);
}

function sample() {
  if (!vidTex || vid.readyState < 2) return;

  vidTex.needsUpdate = true;
  quadMat.map = vidTex;

  renderer.setRenderTarget(rt);
  renderer.render(rtScene, rtCamera);
  renderer.setRenderTarget(null);

  renderer.readRenderTargetPixels(rt, 0, 0, RT_W, RT_H, pixelBuf);

  const cols = Math.floor(RT_W / STEP);
  const rows = Math.floor(RT_H / STEP);
  const ox = -cols * 0.5;
  const oy = -rows * 0.5;

  // Pixel spacing in world units — keep aspect ratio
  const spacingX = 2.0;
  const spacingY = 2.0;

  let idx = 0;
  for (let row = 0; row < rows; row++) {
    for (let c = 0; c < cols; c++) {
      const px = c * STEP;
      const py = RT_H - 1 - row * STEP; // flip Y
      const pi = (py * RT_W + px) * 4;

      const r  = pixelBuf[pi]     / 255;
      const g  = pixelBuf[pi + 1] / 255;
      const b  = pixelBuf[pi + 2] / 255;
      const br = 0.299 * r + 0.587 * g + 0.114 * b;

      // Discard near-black pixels entirely (invisible anyway, saves GPU)
      const on = br > 0.018 ? 1.0 : 0.0;

      bufPos[idx * 3]     = (c + ox) * spacingX;
      bufPos[idx * 3 + 1] = (row + oy) * spacingY;
      // Depth: bright pixels pop forward (toward camera), dark fall back
      // Exponential curve for stronger 3D pop
      bufPos[idx * 3 + 2] = Math.pow(br, 0.7) * DEPTH * on;

      bufCol[idx * 3]     = r * on;
      bufCol[idx * 3 + 1] = g * on;
      bufCol[idx * 3 + 2] = b * on;

      // Brighter pixels get slightly larger dots
      bufSize[idx] = PSIZE * (0.5 + br * 1.5) * on;

      idx++;
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.aColor.needsUpdate   = true;
  geo.attributes.aSize.needsUpdate    = true;
}

// ── animate ───────────────────────────────────────────────────────────────────
(function loop() {
  requestAnimationFrame(loop);
  window._orbit();
  sample();
  renderer.render(scene, camera);
})();

// ── file load ─────────────────────────────────────────────────────────────────
const up   = document.getElementById('upload-screen');
const fi   = document.getElementById('file-input');
const app  = document.getElementById('app');
const btnP = document.getElementById('btnPlay');

up.addEventListener('click', () => fi.click());
up.addEventListener('dragover',  e => { e.preventDefault(); up.style.background = 'rgba(255,255,255,0.02)'; });
up.addEventListener('dragleave', () => up.style.background = '#000');
up.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('video/')) load(f);
});
fi.addEventListener('change', e => { if (e.target.files[0]) load(e.target.files[0]); });

function load(file) {
  if (vid.src) URL.revokeObjectURL(vid.src);
  vid.removeAttribute('crossorigin');
  vid.src = URL.createObjectURL(file);

  vid.addEventListener('canplay', () => {
    vid.play().catch(() => {});

    if (vidTex) vidTex.dispose();
    vidTex = new THREE.VideoTexture(vid);
    vidTex.minFilter = THREE.LinearFilter;
    vidTex.magFilter = THREE.LinearFilter;
    vidTex.format    = THREE.RGBFormat;

    buildParticles();
    up.classList.add('hidden');
    app.classList.add('visible');
  }, { once: true });

  vid.load();
}

// ── controls ──────────────────────────────────────────────────────────────────
btnP.addEventListener('click', () => { if (vid.paused) vid.play(); else vid.pause(); });
vid.addEventListener('play',  () => btnP.textContent = '⏸');
vid.addEventListener('pause', () => btnP.textContent = '▶');

document.getElementById('sDensity').addEventListener('input', e => {
  STEP = parseInt(e.target.value);
  if (vid.videoWidth) buildParticles();
});
document.getElementById('sDepth').addEventListener('input', e => DEPTH = parseInt(e.target.value));
document.getElementById('sSize').addEventListener('input',  e => PSIZE = parseFloat(e.target.value));
document.getElementById('btnReset').addEventListener('click', window._resetOrbit);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
